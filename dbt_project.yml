
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'enpal_assessment_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'enpal_assessment_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Each layer has its own folder, schema and default materialization.
# Schemas are prefixed with the target schema, for example public_pipedrive_staging.
models:
  enpal_assessment_project:
    # Default for all models: tables in the public_pipedrive_marts schema
    +schema: pipedrive_marts
    +materialized: table
    # Staging models mirror the sources, so they are views in their own schema
    staging:
      +schema: pipedrive_staging
      +materialized: view
    # Intermediate models hold the reshaping and business logic, also as views
    intermediate:
      +schema: pipedrive_intermediate
      +materialized: view
    # Marts are the star schema that reports and BI tools query, built as tables
    marts:
      +schema: pipedrive_marts
      +materialized: table
    # Reporting models answer one specific request and read only from the marts
    reporting:
      +schema: pipedrive_reporting
      +materialized: table
